<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="120" height="110">
  <!-- A deliberately terrible cat, as drawn in MS Paint with a mouse. -->
  <rect width="120" height="110" fill="#fff"/>
  <g stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail -->
    <path d="M86 88 C 104 84, 112 64, 103 50" fill="none" stroke-width="5"/>
    <!-- body -->
    <path d="M40 66 C 30 80, 34 101, 58 102 C 84 103, 92 86, 82 66 Z" fill="#f4a63a"/>
    <!-- ears -->
    <path d="M26 30 L 27 6 L 46 22 Z" fill="#f4a63a"/>
    <path d="M70 21 L 93 4 L 89 33 Z" fill="#f4a63a"/>
    <!-- head, lumpy -->
    <path d="M22 44 C 18 22, 44 15, 61 19 C 84 21, 97 33, 92 52 C 89 70, 66 75, 50 73 C 30 72, 24 60, 22 44 Z" fill="#f4a63a"/>
    <!-- eyes: different sizes, different heights -->
    <circle cx="43" cy="40" r="9" fill="#fff"/>
    <circle cx="74" cy="44" r="5.5" fill="#fff"/>
    <circle cx="46" cy="43" r="3.5" fill="#000" stroke="none"/>
    <circle cx="72" cy="42" r="2.2" fill="#000" stroke="none"/>
    <!-- nose and mouth -->
    <path d="M57 52 l5 1 -3 4 z" fill="#ff5fa2"/>
    <path d="M49 61 q6 6 11 0 q4 7 12 -1" fill="none" stroke-width="2.5"/>
    <!-- whiskers, wonky -->
    <path d="M33 54 L 6 49 M34 58 L 9 64 M83 52 L 116 44 M82 57 L 113 62" fill="none" stroke-width="2"/>
    <!-- stripes -->
    <path d="M48 24 l3 9 M58 21 l1 9 M68 24 l-2 8" fill="none" stroke="#a85a00" stroke-width="2.5"/>
  </g>
</svg>
